name: Build Release Assets

on:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Node for frontend asset verification
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '24'
        cache: npm

    - name: Verify embedded frontend assets
      run: |
        npm ci --ignore-scripts --no-audit --no-fund
        npm run vendor:check

    - name: Set up Go from go.mod
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: Install all Go dependencies
      run: go mod download && go mod verify

    - name: Run Tests
      run: go test -mod=readonly -count=1 ./...

    - name: API smoke check
      run: |
        go build -o "$RUNNER_TEMP/traefik-admin" ./cmd/traefik-admin
        python3 scripts/smoke-test.py "$RUNNER_TEMP/traefik-admin"

    - name: Build and Package
      run: ./build.sh

    - name: Upload build-artifacts
      uses: skx/github-action-publish-binaries@44887b225ceca96efd8a912d39c09ad70312af31 # master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        args: "./dist/*.tar.gz"
